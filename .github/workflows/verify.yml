name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the tools' requirements
        run: pip install -r tools/requirements.txt
      - name: Make origin/main the base of the comparison
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Check the changed extensions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python tools/check.py --changed | tee check-report.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## Registry checks"
            echo
            echo '```'
            cat check-report.txt 2>/dev/null || echo "the check did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
