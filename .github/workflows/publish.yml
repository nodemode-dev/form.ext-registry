name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Signing keys present
        id: keys
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          PUBLISHER_SIGNING_KEY: ${{ secrets.PUBLISHER_SIGNING_KEY }}
        run: |
          if [ -n "$REGISTRY_SIGNING_KEY" ] && [ -n "$PUBLISHER_SIGNING_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing published::REGISTRY_SIGNING_KEY and PUBLISHER_SIGNING_KEY are not set yet, so no index or package is published. Add them as described in KEYS.md and run this workflow again."
            echo "Nothing published: the signing keys are not set yet (KEYS.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Install the tools' requirements
        if: steps.keys.outputs.ready == 'true'
        run: pip install -r tools/requirements.txt
      - name: Build, sign and index every package
        if: steps.keys.outputs.ready == 'true'
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          PUBLISHER_SIGNING_KEY: ${{ secrets.PUBLISHER_SIGNING_KEY }}
        run: python tools/build_index.py --require-keys
      - name: Release every version not released yet
        if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pkg in dist/packages/*.formpkg; do
            name="$(basename "$pkg" .formpkg)"
            version="${name##*-}"
            id="${name%-*}"
            tag="ext-${id}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released; its bytes stay as they are"
              continue
            fi
            gh release create "$tag" "$pkg" \
              --target "$GITHUB_SHA" \
              --title "${id} ${version}" \
              --notes "${id} ${version}, built from extensions/${id} at ${GITHUB_SHA}. Verified by the Form Extension Registry and signed by the nodemode publisher key." \
              --latest=false
          done
      - name: Upload the signed index and block list
        if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view index >/dev/null 2>&1; then
            gh release create index \
              --target "$GITHUB_SHA" \
              --title "Extension index" \
              --notes "The signed index of verified Form extensions and the signed block list. Rewritten on every push to main." \
              --latest=false
          fi
          gh release upload index \
            dist/extensions.json dist/extensions.json.sig \
            dist/blocklist.json dist/blocklist.json.sig \
            --clobber
