<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrub Thumbnails</title>
    <link rel="stylesheet" href="scrub-thumbnails.css" />
  </head>
  <body>
    <main class="st">
      <section class="st-sec">
        <h2 class="st-h">Source</h2>
        <div class="st-src">
          <button id="pick" class="st-btn" type="button">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span>Choose Video</span>
          </button>
          <div class="st-src-text">
            <div id="src-name" class="st-src-name">No video chosen</div>
            <div id="src-meta" class="st-src-meta">MP4, WebM or MOV the window can play</div>
          </div>
        </div>
      </section>

      <section class="st-sec">
        <h2 class="st-h">Thumbnails</h2>
        <label class="st-field"><span>Interval</span><span class="st-ctl"><input id="interval" class="st-in st-num" type="number" min="0.5" max="600" step="0.5" value="2" /><span class="st-unit">s</span></span></label>
        <label class="st-field"><span>Width</span><span class="st-ctl"><input id="width" class="st-in st-num" type="number" min="32" max="640" step="2" value="160" /><span class="st-unit">px</span><span id="height-out" class="st-dim">x 90</span></span></label>
        <label class="st-field"><span>Columns</span><span class="st-ctl"><input id="cols" class="st-in st-num" type="number" min="1" max="50" step="1" value="10" /></span></label>
        <label class="st-field"><span>Rows per sheet</span><span class="st-ctl"><input id="rows" class="st-in st-num" type="number" min="1" max="50" step="1" value="10" /></span></label>
        <label class="st-field"><span>Image</span><span class="st-ctl"><select id="fmt" class="st-sel"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select><input id="quality" class="st-in st-num" type="number" min="10" max="100" step="5" value="80" title="Quality" /><span class="st-unit">%</span></span></label>
        <label class="st-field"><span>File name</span><span class="st-ctl"><input id="base" class="st-in st-grow" type="text" value="thumbnails" spellcheck="false" /></span></label>
        <label class="st-field"><span>Sheet URL prefix</span><span class="st-ctl"><input id="prefix" class="st-in st-grow" type="text" value="" placeholder="none: next to the track" spellcheck="false" /></span></label>
        <div id="plan" class="st-plan">Choose a video to see how many thumbnails and sheets this makes.</div>
      </section>

      <section class="st-sec">
        <div class="st-actions">
          <button id="make" class="st-btn st-primary" type="button" disabled>Make Thumbnails</button>
          <button id="cancel" class="st-btn" type="button" disabled>Cancel</button>
        </div>
        <div class="st-progress"><div id="bar" class="st-bar"></div></div>
        <div id="status" class="st-status" role="status">&nbsp;</div>
      </section>

      <section class="st-sec">
        <h2 class="st-h">Test Player</h2>
        <div id="player" class="st-player">
          <div class="st-stage">
            <video id="video" class="st-video" playsinline preload="auto"></video>
            <div id="stage-empty" class="st-stage-empty">Make thumbnails, then hover the bar below</div>
          </div>
          <div class="st-controls">
            <button id="play" class="st-icon" type="button" aria-label="Play" disabled>
              <svg id="ico-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.5 3v10l8-5z" fill="currentColor"/></svg>
              <svg id="ico-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" hidden><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg>
            </button>
            <div id="seek" class="st-seek" aria-label="Seek" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
              <div class="st-track"><div id="seek-fill" class="st-fill"></div><div id="seek-hover" class="st-hover"></div></div>
              <div id="tip" class="st-tip" hidden><div id="tip-img" class="st-tip-img"></div><div id="tip-time" class="st-tip-time">0:00</div></div>
            </div>
            <div id="time" class="st-time">0:00 / 0:00</div>
          </div>
        </div>
      </section>

      <section class="st-sec">
        <div class="st-h-row">
          <h2 class="st-h">Sheets</h2>
          <select id="sheet-sel" class="st-sel st-small" disabled><option>None yet</option></select>
        </div>
        <div class="st-sheet"><img id="sheet-img" class="st-sheet-img" alt="" hidden /></div>
        <h2 class="st-h">Track</h2>
        <pre id="vtt" class="st-vtt">WEBVTT</pre>
        <div class="st-actions">
          <button id="save-zip" class="st-btn st-primary" type="button" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.5v7.5M4.8 7 8 10.2 11.2 7M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Save ZIP</span>
          </button>
          <button id="save-files" class="st-btn" type="button" disabled>Save Track and Sheets</button>
        </div>
      </section>
    </main>
    <script type="module" src="scrub-thumbnails.js"></script>
  </body>
</html>
