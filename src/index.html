<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rehearsal Coach</title>
    <link rel="stylesheet" href="coach.css" />
  </head>
  <body>
    <main class="rc" data-state="idle">
      <section class="rc-plan" aria-label="Plan">
        <div class="rc-plan-row">
          <label class="rc-field rc-target">
            <span>Target</span>
            <input class="rc-input" id="target" type="text" inputmode="numeric" value="10:00" spellcheck="false" autocomplete="off" aria-describedby="plan-note" />
          </label>
          <div class="rc-seg" role="radiogroup" aria-label="Split the target">
            <button type="button" role="radio" data-split="even" aria-checked="true">Evenly</button>
            <button type="button" role="radio" data-split="last" aria-checked="false">Like last run</button>
          </div>
        </div>
        <div class="rc-plan-row rc-plan-sub">
          <p class="rc-note" id="plan-note">Reading the deck</p>
          <label class="rc-check"><input type="checkbox" id="hidden" /><span>Hidden</span></label>
        </div>
      </section>

      <section class="rc-clock" aria-label="Rehearsal">
        <p class="rc-where"><span id="where">No run yet</span></p>
        <div class="rc-big">
          <span class="rc-big-time" id="slide-time">0:00</span>
          <span class="rc-big-of">of <span id="slide-plan">0:00</span></span>
          <span class="rc-chip" id="slide-diff" data-tone="none">ready</span>
        </div>
        <div class="rc-meter" aria-hidden="true"><span class="rc-meter-fill" id="slide-meter"></span><span class="rc-meter-mark"></span></div>
        <dl class="rc-stats">
          <div><dt>Elapsed</dt><dd id="elapsed">0:00</dd></div>
          <div><dt>Left</dt><dd id="left">0:00</dd></div>
          <div><dt>Pace</dt><dd id="pace">Not yet</dd></div>
        </dl>
        <div class="rc-controls">
          <button class="rc-btn rc-icon" type="button" data-act="back" title="Previous slide (Left Arrow)" aria-label="Previous slide" disabled>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="rc-btn rc-primary rc-go" type="button" data-act="go" title="Start the run from the first slide (Space)">
            <svg class="rc-ic-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z" fill="currentColor"/></svg>
            <svg class="rc-ic-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 3.5v9M11 3.5v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="go-label">Start</span>
          </button>
          <button class="rc-btn rc-icon" type="button" data-act="next" title="Next slide (Space or Right Arrow)" aria-label="Next slide" disabled>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="rc-grow"></span>
          <button class="rc-btn" type="button" data-act="finish" title="End the run and keep it" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 14V2.5M4 3h7.5l-1.5 2.5 1.5 2.5H4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Finish</span>
          </button>
          <button class="rc-btn rc-ghost rc-icon" type="button" data-act="cancel" title="Stop and discard this run (Esc)" aria-label="Cancel the run" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p class="rc-summary" id="summary" aria-live="polite">Press Start, then move through the slides here or in FormDeck. Each slide's time is kept against its share of the target.</p>
      </section>

      <section class="rc-list" aria-label="Slides">
        <div class="rc-head" role="row">
          <span class="rc-c-n">#</span><span class="rc-c-title">Slide</span><span class="rc-c-plan">Plan</span><span class="rc-c-run">Run</span><span class="rc-c-last">Last</span>
        </div>
        <ol class="rc-rows" id="rows"></ol>
        <p class="rc-empty" id="empty">Reading the deck</p>
      </section>

      <footer class="rc-foot">
        <p class="rc-runs" id="runs">No runs kept for this deck yet.</p>
        <div class="rc-foot-row">
          <button class="rc-btn rc-primary" type="button" data-act="write" title="Put each slide's time from the latest run into its speaker notes, in one step you can undo" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 2.5h6l3 3v8h-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.5 8h5M5.5 10.5h3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Write to notes</span>
          </button>
          <button class="rc-btn rc-ghost" type="button" data-act="unwrite" title="Take the Rehearsal Coach lines out of the speaker notes" disabled>Remove from notes</button>
          <span class="rc-grow"></span>
          <button class="rc-btn rc-ghost rc-icon" type="button" data-act="clear" title="Forget the runs kept for this deck" aria-label="Forget runs" disabled>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="rc-status" id="status" role="status" aria-live="polite">&nbsp;</p>
      </footer>
    </main>
    <script type="module" src="coach.js"></script>
  </body>
</html>
